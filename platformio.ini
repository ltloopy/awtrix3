; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = ulanzi

; Shared configuration for the Arduino firmware envs. The [env] section is
; deliberately empty so the native test env doesn't inherit framework =
; arduino (which requires a board and breaks `pio test -e native`).
[env]

[arduino_common]
framework = arduino
; Build the device firmware at gnu++17 to match the native test env (see
; platformio.ini [env:native]) so a C++14/17 construct can't pass the host
; suite while breaking the gnu++11 device build. The Arduino-ESP32 platform
; injects -std=gnu++11, so unflag it here (inherited by the device envs via
; extends) and add -std=gnu++17 to each env's build_flags. See docs/adr/0013
; and issue #25.
build_unflags = -std=gnu++11
board_build.f_cpu = 240000000L
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
	bblanchon/ArduinoJson@^6.20.0
	evert-arias/EasyButton@2.0.1
	fastled/FastLED@^3.6.0
	marcmerlin/FastLED NeoMatrix@^1.2
	knolleary/PubSubClient@^2.8
	densaugeo/base64@^1.4.0
	luisllamasbinaburo/MeanFilterLib@^1.0.0
	adafruit/Adafruit BME280 Library@^2.2.2
	adafruit/Adafruit BMP280 Library@^2.6.8
	adafruit/Adafruit HTU21DF Library@^1.0.5
	adafruit/Adafruit SHT31 Library@^2.2.0
	plerup/EspSoftwareSerial@^8.1.0
	maxgerhardt/ghostl

[env:ulanzi]
extends = arduino_common
platform = espressif32@6.3.0
board = esp32dev
build_flags =
	-std=gnu++17
	-DULANZI
	-DMQTT_MAX_PACKET_SIZE=8192
	-D CORE_DEBUG_LEVEL=0
	-Wno-attributes
	-Os
	-fno-exceptions

[env:awtrix2_upgrade]
extends = arduino_common
platform = espressif32
board = wemos_d1_mini32
build_flags =
	-std=gnu++17
	-Dawtrix2_upgrade
	-DMQTT_MAX_PACKET_SIZE=8192
	-D CORE_DEBUG_LEVEL=0
	-D NDEBUG
	-Wno-attributes
	-Os
	-fno-exceptions

; Host-side unit tests for the Timer feature. Runs via `pio test -e native`.
; Only TimerManager.cpp, TimerHa.cpp, TimerView.cpp and TimerSettings.cpp are
; compiled from production sources (via build_src_filter); MQTTManager / PeripheryManager /
; DisplayManager / Preferences / LittleFS / Overlays headers are shadowed by
; stubs in tests/stubs/ via include-path priority. ArduinoFake supplies the
; Arduino.h surface (String, millis, etc.) so those sources compile unchanged
; on the host. (TimerView.cpp depends only on TimerManager — no new stubs.)
[env:native]
platform = native
test_framework = unity
build_src_filter = +<TimerManager.cpp> +<TimerCommand.cpp> +<TimerConfigEditor.cpp> +<TimerHa.cpp> +<TimerView.cpp> +<TimerSettings.cpp> +<TimerSettingsApply.cpp> +<TimerMenu.cpp> +<TimerMenuNav.cpp> +<TimerEnums.cpp> +<TimerRuntime.cpp> +<PeerRegistry.cpp> +<SyncSeenCache.cpp> +<SyncEnvelope.cpp>
test_build_src = true
; The HASelect serializer suite lives in its own env (native_ha) so it can build
; the vendored ArduinoHA library under -DARDUINOHA_TEST without this env's Timer
; stub force-include (native_prelude.h) leaking into the library TUs.
; test_peerregistry lives in its own env (native_peer): PlatformIO eagerly links
; every build_src_filter object, so a suite here would drag in TimerManager.o and
; its globals — the point of PeerRegistry is that it needs none, so it builds alone.
; test_syncseen is the same story in its own env (native_seen), and
; test_syncenvelope in its own env (native_sync) for the pure sync gate (ADR-0023).
test_ignore = test_haselect, test_hasensor, test_hatext, test_hasync, test_peerregistry, test_syncseen, test_syncenvelope, test_validate, test_runtime
build_flags =
	-std=gnu++17
	-DUNIT_TEST
	; ArduinoJson auto-detects the Arduino String class via the ARDUINO
	; macro, which isn't defined on native builds even when ArduinoFake
	; provides String. Force it on so TimerManager.cpp's
	; doc["buzzer"].as<String>() resolves to the right converter.
	-DARDUINOJSON_ENABLE_ARDUINO_STRING=1
	-DARDUINOJSON_ENABLE_STD_STRING=0
	-I tests/stubs
	-include tests/stubs/native_prelude.h
lib_deps =
	bblanchon/ArduinoJson@^6.20.0
	fabiobatsilva/ArduinoFake@^0.4.0

; Host suite for the extracted PeerRegistry (ADR-0021). Compiles ONLY
; src/PeerRegistry.cpp — no Timer sources, no stubs, no native_prelude force-include
; — so the suite proves the module links against nothing but ArduinoFake's String.
; That dependency-free link IS the architectural claim of the extraction.
[env:native_peer]
platform = native
test_framework = unity
build_src_filter = +<PeerRegistry.cpp>
test_build_src = true
test_ignore = test_timer, test_haselect, test_hasensor, test_hatext, test_hasync, test_syncseen, test_syncenvelope, test_validate, test_runtime
build_flags =
	-std=gnu++17
	-DUNIT_TEST
lib_deps =
	fabiobatsilva/ArduinoFake@^0.4.0

; Host suite for the extracted SyncSeenCache (ADR-0022). Compiles ONLY
; src/SyncSeenCache.cpp — no Timer sources, no stubs, no native_prelude force-include
; — so the suite proves the module links against nothing but ArduinoFake's String.
; That dependency-free link IS the architectural claim of the extraction; exactly as
; [env:native_peer] is for PeerRegistry.
[env:native_seen]
platform = native
test_framework = unity
build_src_filter = +<SyncSeenCache.cpp>
test_build_src = true
test_ignore = test_timer, test_haselect, test_hasensor, test_hatext, test_hasync, test_peerregistry, test_syncenvelope, test_validate, test_runtime
build_flags =
	-std=gnu++17
	-DUNIT_TEST
lib_deps =
	fabiobatsilva/ArduinoFake@^0.4.0

; Host suite for the extracted SyncEnvelope (ADR-0023) — the pure inbound sync gate.
; Compiles ONLY src/SyncEnvelope.cpp — no Timer sources, no stubs, no native_prelude
; force-include. Unlike native_peer/native_seen it DOES need ArduinoJson (the module
; reads JsonVariantConst), so its "links against little" claim is weaker than its two
; siblings' "links against nothing but String" — but it still links no Timer code,
; proving the receive decision needs nothing but the packet + {ownId, follow}.
[env:native_sync]
platform = native
test_framework = unity
build_src_filter = +<SyncEnvelope.cpp>
test_build_src = true
test_ignore = test_timer, test_haselect, test_hasensor, test_hatext, test_hasync, test_peerregistry, test_syncseen, test_validate, test_runtime
build_flags =
	-std=gnu++17
	-DUNIT_TEST
	; SyncEnvelope reads Arduino String out of the JSON; force ArduinoJson's Arduino
	; String converter on (the ARDUINO macro isn't defined on native), exactly as
	; [env:native] does for TimerManager.cpp.
	-DARDUINOJSON_ENABLE_ARDUINO_STRING=1
	-DARDUINOJSON_ENABLE_STD_STRING=0
lib_deps =
	bblanchon/ArduinoJson@^6.20.0
	fabiobatsilva/ArduinoFake@^0.4.0

; Host suite for the extracted TimerCommand::classify (#143) -- the PURE atomic-reject
; command validator (ADR-0001), lifted from TimerManager::parseCommand. Like
; native_sync it links the dependency-light descriptor-table family ONLY -- the pure
; TimerSettings.cpp + TimerCommand.cpp + the enum codecs (TimerEnums.cpp) -- with no
; TimerManager singleton, no MQTTManager/Preferences, no stubs, no native_prelude
; force-include. The impure TimerSettingsApply.cpp is deliberately NOT linked: that it
; isn't needed is the architectural claim of the carve (classify reads only the packet
; + a Context). It DOES need ArduinoJson (it reads the packet), same as native_sync.
[env:native_validate]
platform = native
test_framework = unity
build_src_filter = +<TimerCommand.cpp> +<TimerSettings.cpp> +<TimerEnums.cpp>
test_build_src = true
test_ignore = test_timer, test_haselect, test_hasensor, test_hatext, test_hasync, test_peerregistry, test_syncseen, test_syncenvelope, test_runtime
build_flags =
	-std=gnu++17
	-DUNIT_TEST
	; classify reads Arduino String out of the JSON; force ArduinoJson's Arduino String
	; converter on (the ARDUINO macro isn't defined on native), as the siblings do.
	-DARDUINOJSON_ENABLE_ARDUINO_STRING=1
	-DARDUINOJSON_ENABLE_STD_STRING=0
lib_deps =
	bblanchon/ArduinoJson@^6.20.0
	fabiobatsilva/ArduinoFake@^0.4.0

; Host suite for the vendored ArduinoHA library (lib/home-assistant-integration).
; Builds the library with its own ARDUINOHA_TEST harness (PubSubClientMock,
; getSerializer()), no Arduino board, no Timer sources or stubs — so HASelect's
; discovery serializer can be asserted on the host. See test/test_haselect.
[env:native_ha]
platform = native
test_framework = unity
test_ignore = test_timer, test_syncenvelope, test_runtime
; ArduinoHA + PubSubClient declare an Arduino framework, which this host env does
; not set; without these the LDF drops them as "framework incompatible". deep+
; pulls the whole library graph from the bare ArduinoHA.h include.
lib_ldf_mode = deep+
lib_compat_mode = off
build_flags =
	-std=gnu++17
	-DARDUINOHA_TEST
	; ArduinoFake nests IPAddress.h under arduino/; ArduinoHA includes it bare.
	-I tests/stubs_ha
lib_deps =
	fabiobatsilva/ArduinoFake@^0.4.0
	knolleary/PubSubClient@^2.8
	home-assistant-integration

; Host suite for the extracted TimerRuntime (issue #178) — the pure run-state
; engine. Compiles ONLY src/TimerRuntime.cpp — no Timer sources, no TimerManager
; singleton, no PeripheryManager/DisplayManager, no stubs, no native_prelude
; force-include. That the transition decision links against nothing but the engine
; itself (+ ArduinoFake's String, pulled by TimerEnums.h for the TimerState enum)
; IS the architectural claim of the extraction, exactly as native_sync/native_validate
; are for theirs. step() returns effects; it performs none, so it needs no hardware.
[env:native_runtime]
platform = native
test_framework = unity
build_src_filter = +<TimerRuntime.cpp>
test_build_src = true
test_ignore = test_timer, test_haselect, test_hasensor, test_hatext, test_hasync, test_peerregistry, test_syncseen, test_syncenvelope, test_validate
build_flags =
	-std=gnu++17
	-DUNIT_TEST
lib_deps =
	fabiobatsilva/ArduinoFake@^0.4.0
