; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = ulanzi

; Shared configuration for the Arduino firmware envs. The [env] section is
; deliberately empty so the native test env doesn't inherit framework =
; arduino (which requires a board and breaks `pio test -e native`).
[env]

[arduino_common]
framework = arduino
; Build the device firmware at gnu++17 to match the native test env (see
; platformio.ini [env:native]) so a C++14/17 construct can't pass the host
; suite while breaking the gnu++11 device build. The Arduino-ESP32 platform
; injects -std=gnu++11, so unflag it here (inherited by the device envs via
; extends) and add -std=gnu++17 to each env's build_flags. See docs/adr/0013
; and issue #25.
build_unflags = -std=gnu++11
board_build.f_cpu = 240000000L
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
	bblanchon/ArduinoJson@^6.20.0
	evert-arias/EasyButton@2.0.1
	fastled/FastLED@^3.6.0
	marcmerlin/FastLED NeoMatrix@^1.2
	knolleary/PubSubClient@^2.8
	densaugeo/base64@^1.4.0
	luisllamasbinaburo/MeanFilterLib@^1.0.0
	adafruit/Adafruit BME280 Library@^2.2.2
	adafruit/Adafruit BMP280 Library@^2.6.8
	adafruit/Adafruit HTU21DF Library@^1.0.5
	adafruit/Adafruit SHT31 Library@^2.2.0
	plerup/EspSoftwareSerial@^8.1.0
	maxgerhardt/ghostl

[env:ulanzi]
extends = arduino_common
platform = espressif32@6.3.0
board = esp32dev
build_flags =
	-std=gnu++17
	-DULANZI
	-DMQTT_MAX_PACKET_SIZE=8192
	-D CORE_DEBUG_LEVEL=0
	-Wno-attributes
	-Os
	-fno-exceptions

[env:awtrix2_upgrade]
extends = arduino_common
platform = espressif32
board = wemos_d1_mini32
build_flags =
	-std=gnu++17
	-Dawtrix2_upgrade
	-DMQTT_MAX_PACKET_SIZE=8192
	-D CORE_DEBUG_LEVEL=0
	-D NDEBUG
	-Wno-attributes
	-Os
	-fno-exceptions

; Host-side unit tests for the Timer feature. Runs via `pio test -e native`.
; Only TimerManager.cpp, TimerHa.cpp, TimerView.cpp and TimerSettings.cpp are
; compiled from production sources (via build_src_filter); MQTTManager / PeripheryManager /
; DisplayManager / Preferences / LittleFS / Overlays headers are shadowed by
; stubs in tests/stubs/ via include-path priority. ArduinoFake supplies the
; Arduino.h surface (String, millis, etc.) so those sources compile unchanged
; on the host. (TimerView.cpp depends only on TimerManager — no new stubs.)
[env:native]
platform = native
test_framework = unity
build_src_filter = +<TimerManager.cpp> +<TimerConfigEditor.cpp> +<TimerHa.cpp> +<TimerView.cpp> +<TimerSettings.cpp> +<TimerMenu.cpp> +<TimerEnums.cpp>
test_build_src = true
build_flags =
	-std=gnu++17
	-DUNIT_TEST
	; ArduinoJson auto-detects the Arduino String class via the ARDUINO
	; macro, which isn't defined on native builds even when ArduinoFake
	; provides String. Force it on so TimerManager.cpp's
	; doc["buzzer"].as<String>() resolves to the right converter.
	-DARDUINOJSON_ENABLE_ARDUINO_STRING=1
	-DARDUINOJSON_ENABLE_STD_STRING=0
	-I tests/stubs
	-include tests/stubs/native_prelude.h
lib_deps =
	bblanchon/ArduinoJson@^6.20.0
	fabiobatsilva/ArduinoFake@^0.4.0
